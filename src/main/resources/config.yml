# XP levels needed to create an image map (0 = free).
xp-cost-levels: 5

# Require an empty map item to create an image map.
# One empty map is used per tile (2x2 = 4 maps).
require-empty-map: true

# Max maps one image can use (rows x cols). 64 = 8x8.
max-maps: 64

# Seconds to type the image URL in chat after running /mapimage
# with no arguments.
chat-input-timeout-seconds: 30

maps: {}
